- name: "Add rhel locale"
  become: true
  tags: basic
  when: ansible_os_family == "RedHat"
  ansible.builtin.dnf:
    state: present
    name:
      - langpacks-ru
      - glibc-langpack-ru

- name: "Add debian locale"
  become: true
  tags: basic
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: "Install locales package"
      ansible.builtin.apt:
        name: locales
        state: present

    - name: "Generate ru_RU.UTF-8 locale"
      community.general.locale_gen:
        name:
          - ru_RU.UTF-8
          - en_US.UTF-8
        state: present

# FYI See Debian's /usr/share/dbus-1/system.d/systemd-localed-read-only.conf
- name: "Set LANG and LC_MESSAGES"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ '/etc/default/locale' if ansible_facts['os_family'] == 'Debian' else '/etc/locale.conf' }}"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0644"
  loop:
    - { key: "LANG", value: "ru_RU.UTF-8" }
    - { key: "LC_MESSAGES", value: "en_US.UTF-8" }

- name: "Setup timezone"
  become: true
  tags: basic
  community.general.timezone:
    name: Europe/Moscow

- name: "Setup Gnome locale switcher"
  tags: basic
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value | string }}"
  loop:
    - { key: "/org/gnome/desktop/input-sources/sources", value: "[('xkb', 'us'), ('xkb', 'ru')]" }
    - { key: "/org/gnome/desktop/input-sources/xkb-options", value: "['grp:ctrl_space_toggle']" }
    - { key: "/org/gnome/desktop/input-sources/per-window", value: "true" }

- name: "Setup Gnome region"
  tags: basic
  community.general.dconf:
    key: "/system/locale/region"
    value: "'ru_RU.UTF-8'"
