---
- name: "Added EPEL"
  when: ansible_os_family == "RedHat"
  ansible.builtin.include_tasks: repos/epel.yml

- name: "Add basic apps"
  become: true
  ansible.builtin.package:
    name: lshw
    state: present

- name: "Enable fstrim timer"
  become: true
  tags: basic
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started
  # when: ansible_virtualization_role != "guest"
