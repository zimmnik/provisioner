---
# FYI https://discourse.gnome.org/t/enable-gnome-extensions-without-session-restart/7936
- name: "Restart GUI session"
  become: true
  tags: basic
  block:
    - name: "Enable gdm autologin"
      become: true
      ansible.builtin.blockinfile:
        dest: "{{ '/etc/gdm3/daemon.conf' if ansible_facts['os_family'] == 'Debian' else '/etc/gdm/custom.conf' }}"
        create: true
        mode: 'u=rw,g=r,o=r'
        marker: "#<!-- {mark} ANSIBLE MANAGED BLOCK gnome autologin -->"
        insertafter: "\\[daemon\\]"
        block: |
          AutomaticLoginEnable=True
          AutomaticLogin={{ ansible_user_id }}
      register: gnome_de_autologin_state
    - name: "Restart gdm"
      ansible.builtin.service:
        name: gdm
        state: restarted
      changed_when: false
    - name: "Wait GUI session"
      ansible.builtin.pause:
        seconds: 15
      changed_when: false
    - name: "Disable gdm autologin"
      ansible.builtin.blockinfile:
        dest: "{{ '/etc/gdm3/daemon.conf' if ansible_facts['os_family'] == 'Debian' else '/etc/gdm/custom.conf' }}"
        marker: "#<!-- {mark} ANSIBLE MANAGED BLOCK gnome autologin -->"
        state: absent
      when: gnome_de_autologin_state.changed # noqa: no-handler
      changed_when: false
