---
- name: "Added EPEL"
  ansible.builtin.include_tasks: "repos/epel.yml"
  when: ansible_os_family == "RedHat"

- name: "Add flathub repo"
  ansible.builtin.include_tasks: "repos/flathub.yml"

- name: "Add console file utilites, part 1"
  become: true
  tags: basic
  ansible.builtin.package:
    state: present
    name:
      - tree
      - mc
      - unzip
      - tar
      - zstd
      - cifs-utils
      - lsof
      - iotop
      - sysstat

- name: "Add console file utilites, part 2"
  become: true
  ansible.builtin.package:
    name: "{{ packages_by_distro[ansible_distribution] }}"
    state: present
  vars:
    packages_by_distro:
      Fedora: &rhel
        - ncdu
        - p7zip
        - p7zip-plugins
      Oracle: *rhel
      Debian:
        - ncdu
        - p7zip-full

- name: "Setup mc"
  tags: basic
  ansible.builtin.blockinfile:
    dest: ~/.bashrc
    marker: "#<!-- {mark} ANSIBLE MANAGED BLOCK filemanager mc -->"
    block: |
      alias mc="mc -b"

- name: "Add gui file utilites"
  become: true
  tags: basic
  ansible.builtin.package:
    state: present
    name: "{{ packages_by_distro[ansible_distribution] }}"
  vars:
    packages_by_distro:
      Fedora: &rhel2
        - nautilus
        - seahorse
        - gvfs-mtp
        - gvfs-smb
        - gvfs-gphoto2
        - gvfs-fuse
        - xdg-utils
        - xdg-user-dirs-gtk
      Oracle: *rhel2
      Debian:
        - nautilus
        - seahorse
        - gvfs-backends
        - gvfs-fuse
        - xdg-utils
        - xdg-user-dirs-gtk

- name: "Setup Nautilus"
  tags: basic
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value | string }}"
  loop:
    - { key: "/org/gnome/nautilus/list-view/use-tree-view", value: "true" }
    - { key: "/org/gnome/desktop/media-handling/autorun-never", value: "true" }
    - { key: "/org/gnome/nautilus/list-view/default-zoom-level", value: "'small'" }
    - { key: "/org/gnome/settings-daemon/plugins/media-keys/home", value: "['<Super>e']" }
    - { key: "/org/gnome/nautilus/preferences/default-folder-viewer", value: "'list-view'" }
    - { key: "/org/gnome/nautilus/preferences/search-filter-time-type", value: "'last_modified'" }

- name: "Add PeaZip"
  become: true
  community.general.flatpak:
    name: io.github.peazip.PeaZip
    state: present
